<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madio Express</title>
  <script>
    // GitHub Pages has no rewrites: /pedido/<store>/<order> (the "Ver el pedido" link of the
    // new-order e-mail, finding 211) lands here. Send it to the admin's hash route, which
    // opens that order after the login. Any other missing page shows the message below.
    (function () {
      var match = window.location.pathname.match(/^\/pedido\/(\d+)\/(\d+)\/?$/);
      if (match) {
        window.location.replace('/#/pedido/' + match[1] + '/' + match[2]);
      }
    })();
  </script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #F7F6FB; color: #1F1A2E;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    main { text-align: center; padding: 24px; }
    a { color: #835CCE; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>No encontramos esta página</h1>
    <p><a href="/">Ir a Madio Express</a></p>
  </main>
</body>
</html>
